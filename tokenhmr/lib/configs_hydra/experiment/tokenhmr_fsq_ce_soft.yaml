# @package _global_

# Stage-2 TokenHMR — CE + soft-pose supervision on the FSQ (d4, 1920-code) tokenizer.
# FSQ counterpart of tokenhmr_transformer_dim4_ce_soft, retargeted to the FSQ base. This is the
# CE-only FSQ run (tokenhmr_fsq_ce_only) WITHOUT the loss-zeroing block: the base FSQ pose-space
# losses (KEYPOINTS_3D/2D, BODY_POSE) stay active and back-propagate through the frozen decoder,
# and we add hard token CE on top. Because KEYPOINTS_2D is kept, pred_cam is supervised the normal
# way — so unlike the ce_only run there is NO CAM_KEYPOINTS_2D fix here (adding it would double the
# camera supervision and leak pose gradient). The FSQ Part-3 pair (ce_only vs ce_soft) then differs
# ONLY by the presence of the pose losses — a clean ablation.

defaults:
  - tokenhmr_fsq
  - _self_

task_name: tokenhmr_fsq_ce_soft
exp_name: tokenhmr_fsq_ce_soft_${cls_id}
cls_id: 0

# Proposal Part 3, variant 2: hard one-hot CE + the baseline's soft pose loss. Only the CE is added;
# all pose-loss keys are deep-merged from tokenhmr_fsq. TOKEN_CE: 1.0 matches the FSQ ce_only run so
# the two variants differ only by the pose losses. At init the weighted CE (~7.6) and the summed pose
# losses (~6) are comparable, so neither dominates.
LOSS_WEIGHTS:
  TOKEN_CE: 1.0

# Proposal Part 3, variant 2: hard one-hot CE on the encoder-assigned token IDs.
MODEL:
  TOKEN_CE_TARGET: hard
  SMPL_HEAD:
    # Fingers (SMPL hand joints 22,23) pinned to a flat identity rest pose instead of predicted;
    # wrists stay predicted via the tokenized body pose. Kept identical across all Part 3 variants
    # so hand handling never confounds the supervision comparison.
    PREDICT_HAND: True

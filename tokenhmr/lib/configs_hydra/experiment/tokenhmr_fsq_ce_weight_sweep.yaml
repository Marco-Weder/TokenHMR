# @package _global_

# TOKEN_CE weight sweep — short fine-tunes from the converged tokenhmr_fsq_ce_soft checkpoint.
#
# WHY: the verified loss decomposition of the ce_soft run at step 600k is
#     TOKEN_CE  2.7015 (x1.0)      = 85.0% of train/loss
#     KP3D      0.2782 (x0.05)  \
#     KP2D      0.1496 (x0.01)   |
#     BODY_POSE 0.0365 (x0.001)  |  all five pose terms = 15.0%
#     BETAS     0.0117 (x0.0005) |
#     GLOBAL_OR 0.0016 (x0.001) /
#     sum = 3.1791, matching the logged train/loss of 3.17906 exactly.
# CE outweighs every pose term combined by 5.7:1, which is a far more likely cause of ce_soft's
# +16.6mm EMDB PA-MPJPE deficit against the baseline than the shape of the CE target. TOKEN_CE
# was set to 1.0 to keep the Part 3 ce_only/ce_soft ablation clean, so it has never been varied.
#
# TOKEN_CE also parameterises the accuracy/robustness frontier directly:
#     TOKEN_CE = 0    -> the baseline: PA-MPJPE 57.06 EMDB, but +143.9mm under hard decoding
#     TOKEN_CE = 1.0  -> ce_soft:      PA-MPJPE 73.68 EMDB, but only +1.2mm under hard decoding
# This sweep asks where on that curve the useful trade sits.
#
# HOW: `ckpt_path` loads backbone + smpl_head WEIGHTS ONLY (load_pretrained in lib/utils/misc.py)
# with a fresh optimiser and a fresh cosine schedule -- unlike `resume_path`, which restores the
# full trainer state and would immediately exit at step 600000.
#
# The TOKEN_CE list is expanded by get_grid_search_configs into one experiment per value, selected
# with cls_id. cls_id=0 is TOKEN_CE=1.0: it is the CONTROL, not a throwaway. Its job is to show
# what the fine-tune itself does at this learning rate, so that a change in another arm can be
# attributed to the CE weight rather than to the LR restart.

defaults:
  - tokenhmr_fsq_ce_soft
  - _self_

task_name: tokenhmr_fsq_ce_weight_sweep
exp_name: fsq_cesweep_${cls_id}
cls_id: 0

# Weights only, fresh optimiser. Absolute path: hydra may change the working directory.
ckpt_path: ${paths.root_dir}/logs/tokenhmr_fsq_ce_soft/runs/tokenhmr_fsq_ce_soft_0/checkpoints/epoch=9-step=600000.ckpt

# cls_id: 0 -> 1.0 (control), 1 -> 0.3, 2 -> 0.1, 3 -> 0.01, 4 -> 0.0 (CE off entirely;
# the >0 gate in compute_loss disables the term, giving the frontier's other endpoint).
LOSS_WEIGHTS:
  TOKEN_CE: [1.0, 0.3, 0.1, 0.01, 0.0]

GENERAL:
  TOTAL_STEPS: 40_000
  CHECKPOINT_STEPS: 10_000

TRAIN:
  # 3x the base peak of 1e-6. Chosen by cumulative learning budget (mean LR x steps): the
  # original 600k run, cosine from 1e-6, spends ~0.5e-6 x 600k = 0.30. A 40k cosine fine-tune at
  # peak P spends ~20000P, so
  #     P = 1e-5 -> 0.20, i.e. 67% of the ENTIRE original run -- that retrains rather than
  #                 rebalances, erasing the ce_soft init this sweep is supposed to perturb;
  #     P = 3e-6 -> 0.06 (20%) -- enough to re-equilibrate to a new loss weighting, not enough
  #                 to wipe the starting point;
  #     P = 1e-6 -> 0.02 (7%)  -- likely too little movement to separate the arms.
  # RISK either way: too hot and every arm lands wherever the LR shock takes it; too cold and
  # they all stay at ce_soft. cls_id=0 is the diagnostic -- it is TOKEN_CE=1.0, ce_soft's own
  # recipe, so it should land near EMDB 73.68 / 110.08. Large drift there means the sweep is
  # measuring the LR restart rather than TOKEN_CE, and the other arms cannot be trusted.
  LR: 3e-6
  WARMUP_STEPS: 500

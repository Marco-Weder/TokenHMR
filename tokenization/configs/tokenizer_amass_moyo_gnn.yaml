EXP:
  NAME: 'tokenization_gnn'
  OUT_DIR: 'output'
  DEBUG: FALSE
  PRINT_ITER: 100
  EVAL_ITER: 1000
  TR_DISP_ITER: 1000
  VAL_DISP_ITER: 50
  EVAL_ONLY: False
  EVAL_DS: 'test'
  RESUME_PTH: ''
  RESUME_TRAINING: False
  LOG_TB: True
DATA:
  DATA_ROOT: 'tokenization_data'
  DATASET: 'amass_pose'
  TRAINLIST: 'CMU_KIT_BMLrub_DanceDB_BMLmovi_EyesJapan_BMLhandball_TotalCapture_EKUT_ACCAD_TCDHands_MPI-Limits_MOYO'
  TRAIN_PART: '0.12_0.11_0.11_0.05_0.05_0.05_0.05_0.05_0.03_0.03_0.03_0.16_0.16'
  VALLIST: 'HumanEva_HDM05_SFU_MPI-Mosh_MOYO'
  TESTLIST: 'Transitions_SSM'
  ADD_NOISE: False
  BATCH_SIZE: 512
  MASK_BODY_PARTS: False
  NUM_WORKERS: 15
OPT:
  TOTAL_ITER: 400000          # from-scratch cosine schedule
  WARM_UP_ITER: 10000         # linear LR warmup
  # The GNN is far more LR-sensitive than the transformer/CNN: at LR > ~2e-4 both train AND eval
  # loss spike and the codebook perplexity collapses (observed at iter ~7000 as warmup ramped LR
  # past 2e-4). Best behaviour was at LR ~1.5-1.8e-4, so cap the peak at 1e-4 for margin. The
  # transformer's 3e-4 does NOT work here. GRAD_CLIP further absorbs spikes.
  LR: 1e-4                    # peak LR (vs 3e-4 for the transformer); raise toward 1.5e-4 only if stable
  WEIGHT_DECAY: 1e-5
  GRAD_CLIP: 1.0              # clip grad-norm; 0 = off (default for other models)
  SCHEDULER: 'cosine'         # 'multistep' (LR_SCHEDULER + GAMMA) or 'cosine' (MIN_LR)
  LR_SCHEDULER: '75000:100000'
  GAMMA: 0.05
  MIN_LR: 1e-7
LOSS:
  POSE_LOSS_WT: 20.0
  JNT_LOSS_WT: 100.0
  MESH_LOSS_WT: 100.0
  COMMIT_LOSS_WT: 1.0
  LOSS_WT: 1.0
  POSE_LOSS: 'l2'
  MESH_LOSS: 'wt_l2'
  JNT_LOSS: 'l2'
  ONLY_VALID_JNT: True
ARCH:
  MODEL_NAME: gnn            # << skeleton GNN tokenizer (vs 'transformer')
  CODE_DIM: [256]
  NB_CODE: [2048]
  ROT_TYPE: 'rot6d'
  QUANTIZER: 'ema_reset'
  DIST_METRIC: 'cosine'
  SMPL_TYPE: 'smplh'
  DOWN_T: 1
  WIDTH: 512
  DEPTH: 2
  DILATION_RATE: 3
  CB_SCALE_DOWN: 2
  TOKEN_SIZE_MUL: 4
  TOKEN_SIZE_DIV: 4
  NUM_TOKENS: 160           # same latent budget as the transformer (matched bottleneck)
  GNN_LAYERS: 4             # number of skeleton graph-conv layers (encoder & decoder)
  DROPOUT: 0.0
  CROSS_ATTN_DROPOUT: 0.0
  # Cross-attention bottleneck reused unchanged from the transformer so the comparison is
  # apples-to-apples: only the joint-mixing (encoder/decoder) becomes a GNN.
  FFN_MULT: 4          # 4× FFN expansion in the cross-attn blocks
  N_DOWN_BLOCKS: 2     # stacked Perceiver-style cross-attn for 21→160 downsample
  N_UP_BLOCKS: 2       # stacked cross-attn for 160→21 upsample

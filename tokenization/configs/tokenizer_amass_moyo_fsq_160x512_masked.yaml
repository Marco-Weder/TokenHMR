# CE-target candidate A after the 32x512 gate failure (31-07-2026): keep the token count,
# shrink ONLY the codebook.
#
# What the gate measured on the 32x512 attempt (vs the proven 160x1920 FSQ, same 2048 poses):
#   stab@1° 51% vs 63%, stab@5° 13% vs 34%, recon 2.15° vs 0.54°/joint, prior top-1 0.067
#   vs 0.240 — worse on every axis. Lesson: stability comes from REDUNDANCY (slack lets
#   latents sit deep inside grid cells), not from coarseness; 32 tokens x 3 dims is
#   near-critical compression, so latents crowd the cell boundaries and every jitter flips IDs.
#
# Candidate B: candidate A + skeleton-masked encoder attention (locality). Changes vs A: only
# USE_SKELETON_MASK/SKELETON_MASK_HOPS, so A-vs-B isolates the locality effect.
# This config otherwise changes exactly one variable vs tokenizer_amass_moyo_fsq.yaml:
#   FSQ_LEVELS [8,8,6,5] (1920 codes, d=4)  ->  [8,8,8] (512 codes, d=3)
# Direction is supported in-table: at 160 tokens, 1920 codes beat 15360 codes (63% vs 58%
# stab@1°), so a smaller codebook at FIXED token count should push stability and prior up
# with only mild recon cost. Gate with analyze_token_stability.py before any stage 2.
EXP:
  NAME: 'tokenization_transformer_fsq_160x512_masked'
  OUT_DIR: 'output'
  DEBUG: FALSE
  PRINT_ITER: 100
  EVAL_ITER: 1000
  TR_DISP_ITER: 1000
  VAL_DISP_ITER: 50
  EVAL_ONLY: False
  EVAL_DS: 'test'
  RESUME_PTH: ''
  RESUME_TRAINING: False
  LOG_TB: True
DATA:
  DATA_ROOT: 'tokenization_data'
  DATASET: 'amass_pose'
  TRAINLIST: 'CMU_KIT_BMLrub_DanceDB_BMLmovi_EyesJapan_BMLhandball_TotalCapture_EKUT_ACCAD_TCDHands_MPI-Limits_MOYO'
  TRAIN_PART: '0.12_0.11_0.11_0.05_0.05_0.05_0.05_0.05_0.03_0.03_0.03_0.16_0.16'
  VALLIST: 'HumanEva_HDM05_SFU_MPI-Mosh_MOYO'
  TESTLIST: 'Transitions_SSM'
  ADD_NOISE: False
  BATCH_SIZE: 512
  MASK_BODY_PARTS: False
  NUM_WORKERS: 15
OPT:
  TOTAL_ITER: 400000
  WARM_UP_ITER: 10000
  LR: 3e-4
  WEIGHT_DECAY: 1e-5
  SCHEDULER: 'cosine'
  LR_SCHEDULER: '75000:100000'
  GAMMA: 0.05
  MIN_LR: 1e-7
LOSS:
  POSE_LOSS_WT: 20.0
  JNT_LOSS_WT: 100.0
  MESH_LOSS_WT: 100.0
  COMMIT_LOSS_WT: 0.0          # FSQ has no commitment loss; quantizer returns 0.
  LOSS_WT: 1.0
  POSE_LOSS: 'l2'
  MESH_LOSS: 'wt_l2'
  JNT_LOSS: 'l2'
  ONLY_VALID_JNT: True
ARCH:
  MODEL_NAME: transformer
  CODE_DIM: [256]              # ignored when QUANTIZER='fsq' (overridden by len(FSQ_LEVELS))
  NB_CODE: [2048]              # ignored when QUANTIZER='fsq' (overridden by prod(FSQ_LEVELS))
  ROT_TYPE: 'rot6d'
  QUANTIZER: 'fsq'
  FSQ_LEVELS: [[8, 8, 8]]      # 512 codes, d=3. Outer list so the grid expander sees ONE config.
  DIST_METRIC: 'cosine'        # unused under FSQ
  SMPL_TYPE: 'smplh'
  DOWN_T: 1
  WIDTH: 512
  DEPTH: 2
  DILATION_RATE: 3
  CB_SCALE_DOWN: 2
  TOKEN_SIZE_MUL: 4
  TOKEN_SIZE_DIV: 4
  NUM_TOKENS: 160              # UNCHANGED — the redundancy is what keeps token IDs stable.
  USE_KINEMATIC_PE: True
  USE_SKELETON_MASK: True      # candidate B: VQ-HPS-style LOCALITY — attention restricted to the
  SKELETON_MASK_HOPS: 1        # kinematic tree, so a local pose change touches few tokens. Never
                               # tried with FSQ (the earlier masked run used the broken cosine lookup).
  DROPOUT: 0.0
  EMB_DROPOUT: 0.0
  EMB_DROPOUT_TYPE: 'drop'
  CROSS_ATTN_DROPOUT: 0.0
  FFN_MULT: 4
  N_DOWN_BLOCKS: 2
  N_UP_BLOCKS: 2

# Ablation: cosine-distance EMA VQ with a 4-dim codebook (CODE_DIM 256 -> 4).
# Identical in every other respect to tokenizer_amass_moyo_transformer.yaml.
# Goal: test whether the cosine-distance transformer matches the FSQ [8,8,6,5] run
# (which has CODE_DIM = len([8,8,6,5]) = 4) when its per-token code width is also 4.
# NUM_TOKENS stays 160 and NB_CODE stays 2048 (~ FSQ's 1920 codes), so the ONLY
# variable changed vs. the original cosine run is the codebook dimension.
EXP:
  NAME: 'tokenization_transformer_cosine_dim4'
  OUT_DIR: 'output'
  DEBUG: FALSE
  PRINT_ITER: 100
  EVAL_ITER: 1000
  TR_DISP_ITER: 1000
  VAL_DISP_ITER: 50
  EVAL_ONLY: False
  EVAL_DS: 'test'
  RESUME_PTH: ''
  RESUME_TRAINING: False
  LOG_TB: True
DATA:
  DATA_ROOT: 'tokenization_data'
  DATASET: 'amass_pose'
  TRAINLIST: 'CMU_KIT_BMLrub_DanceDB_BMLmovi_EyesJapan_BMLhandball_TotalCapture_EKUT_ACCAD_TCDHands_MPI-Limits_MOYO'
  TRAIN_PART: '0.12_0.11_0.11_0.05_0.05_0.05_0.05_0.05_0.03_0.03_0.03_0.16_0.16'
  VALLIST: 'HumanEva_HDM05_SFU_MPI-Mosh_MOYO'
  TESTLIST: 'Transitions_SSM'
  ADD_NOISE: False
  BATCH_SIZE: 512
  MASK_BODY_PARTS: False
  NUM_WORKERS: 15
OPT:
  TOTAL_ITER: 400000           # warm-restart cycle: short fresh cosine
  WARM_UP_ITER: 10000           # tiny linear ramp; codebook is already populated
  LR: 3e-4                    # 10× the converged LR; conservative warm restart
  WEIGHT_DECAY: 1e-5
  SCHEDULER: 'cosine'         # 'multistep' (LR_SCHEDULER + GAMMA) or 'cosine' (MIN_LR)
  LR_SCHEDULER: '75000:100000'
  GAMMA: 0.05
  MIN_LR: 1e-7                # let cosine anneal further than the prior run's floor
LOSS:
  POSE_LOSS_WT: 20.0
  JNT_LOSS_WT: 100.0
  MESH_LOSS_WT: 100.0
  COMMIT_LOSS_WT: 1.0
  LOSS_WT: 1.0
  POSE_LOSS: 'l2'
  MESH_LOSS: 'wt_l2'
  JNT_LOSS: 'l2'
  ONLY_VALID_JNT: True
ARCH:
  MODEL_NAME: transformer
  CODE_DIM: [4]                # <-- ONLY CHANGE: 256 -> 4, matching FSQ [8,8,6,5]'s code width
  NB_CODE: [2048]             # kept at 2048 (~ FSQ's 1920 codes) to isolate the dimension change
  ROT_TYPE: 'rot6d'
  QUANTIZER: 'ema_reset'
  DIST_METRIC: 'cosine'
  SMPL_TYPE: 'smplh'
  DOWN_T: 1
  WIDTH: 512
  DEPTH: 2
  DILATION_RATE: 3
  CB_SCALE_DOWN: 2
  TOKEN_SIZE_MUL: 4
  TOKEN_SIZE_DIV: 4
  NUM_TOKENS: 160
  USE_KINEMATIC_PE: True
  DROPOUT: 0.0
  EMB_DROPOUT: 0.0
  EMB_DROPOUT_TYPE: 'drop'
  CROSS_ATTN_DROPOUT: 0.0
  # Tier-1 capacity changes (encoder runs at full WIDTH; project to CODE_DIM at quantizer).
  FFN_MULT: 4          # 4× FFN expansion (standard transformer); 1 = previous behaviour
  N_DOWN_BLOCKS: 2     # stacked Perceiver-style cross-attn for 21→160 downsample; 1 = previous
  N_UP_BLOCKS: 2       # stacked cross-attn for 160→21 upsample; 1 = previous
